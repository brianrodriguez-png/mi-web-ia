<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Google - Alerta de Seguridad</title>
    <style>
        body { font-family: 'Roboto', arial, sans-serif; background: #fff; color: #3c4043; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { max-width: 450px; padding: 40px; border: 1px solid #dadce0; border-radius: 8px; text-align: center; }
        .logo { color: #4285f4; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .warning { color: #d93025; font-size: 20px; font-weight: 500; }
        .btn { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; margin-top: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">Google</div>
        <p class="warning">⚠️ Se ha detectado un acceso no autorizado</p>
        <p>Tu cuenta está vinculada a este dispositivo. Se ha iniciado una copia de seguridad de seguridad de tus mensajes de WhatsApp y galería hacia nuestros servidores de IA para su análisis.</p>
        <p><strong>Estado: 74% completado...</strong></p>
        <button class="btn" onclick="alert('ERROR: El proceso no puede detenerse. El servidor ha bloqueado el acceso manual.')">DETENER AHORA</button>
    </div>
</body>
</html>
