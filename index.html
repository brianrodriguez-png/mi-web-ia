

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡ALERTA DE SEGURIDAD!</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; overflow: hidden; }
        #hack { font-size: 1.2rem; }
        .boton-trampa {
            padding: 15px 30px;
            background: red;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            position: absolute;
            cursor: pointer;
            transition: 0.1s;
        }
    </style>
</head>
<body>

    <h1>⚠️ ERROR DEL SISTEMA ⚠️</h1>
    <p id="hack">Iniciando descarga de datos personales...</p>
    <p>Para detener la descarga, presiona el botón:</p>

    <button class="boton-trampa" id="btn" onmouseover="escapar()" onclick="victoria()">DETENER HACKEO</button>

    <script>
        function escapar() {
            const btn = document.getElementById('btn');
            // Mueve el botón a una posición aleatoria
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function victoria() {
            alert("¡Imposible! Lograste darle al botón. Eres un crack.");
        }
        
        // Efecto de texto escribiéndose
        let i = 0;
        let txt = 'Accediendo a la galería de fotos... Enviando historial a tus contactos... COMPLETO.';
        function escribir() {
            if (i < txt.length) {
                document.getElementById("hack").innerHTML += txt.charAt(i);
                i++;
                setTimeout(escribir, 50);
            }
        }
        setTimeout(escribir, 2000);
    </script>
</body>
</html>
